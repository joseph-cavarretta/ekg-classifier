[project]
name = "ekg-classifier"
version = "0.1.0"
description = "Deep neural network classification model for electrocardiogram signals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "pyspark>=3.5.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "google-cloud-bigquery>=3.14.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-dataproc>=5.8.0",
    "joblib>=1.3.0",
    "tenacity>=8",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.10",
    "ruff>=0.16",
    "pre-commit>=3.6.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.28.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pandas-stubs>=3.0.5.260914",
]

[project.scripts]
ekg-train = "app.cli.train:main"
ekg-gcp-setup = "app.cli.gcp_setup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libs", "app", "config.py", "errors.py", "models.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-v",
    "--cov=libs",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.ruff]
extend = "../agent-dev-harness/python-styleguide/ruff-base.toml"

[tool.ruff.lint.isort]
known-first-party = ["app", "config", "errors", "libs", "models"]

[tool.mypy]
strict = true
# Same loose paths as the lint baseline: scripts/ and .local/ are not checked.
exclude = ['(^|/)scripts/', '(^|/)\.local/']
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# These packages ship no type information.
module = ["joblib.*", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# google-cloud-dataproc ships typed protos that only accept Cluster/Job messages,
# but the client equally accepts the dict specs used here. Treat it as a boundary.
module = ["google.cloud.dataproc_v1", "google.cloud.dataproc_v1.*"]
follow_imports = "skip"
